[project]
name = "aitrading"
version = "0.1.0"
description = "Single-instrument systematic trading engine for MT5 (XAUUSD/EURUSD)"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
# The core engine is deliberately dependency-free so it runs anywhere and is
# fully unit-testable. These extras are only needed for live/MT5 operation.
mt5 = ["MetaTrader5>=5.0.45"]
analysis = ["pandas>=2.0", "matplotlib>=3.7"]
dev = ["pytest>=7.0", "ruff>=0.4"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Belt and braces alongside conftest.py: pytest >= 7 honours this directly, and
# older versions fall back to the conftest.py path insertion.
pythonpath = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
